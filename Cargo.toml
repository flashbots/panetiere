[package]
name = "flashnet"
version = "0.1.0"
edition = "2021"

[dependencies]
# `parallel` disabled: profiling at the target (S=8, N=100) showed ~14% of
# cycles in `crossbeam_epoch` rayon overhead with no measurable speedup at
# n_leaves ≤ 64. Re-enable when n_leaves ≫ #cores.
chipmunk_code = { git = "https://github.com/Ruteri/Chipmunk", branch = "main", default-features = false, features = ["fast-ntt"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "scaling"
harness = false

# Release-with-debug-info profile for callgrind / perf. Use via `cargo build
# --profile profiling --bin <bin>` or `cargo bench --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[[example]]
name = "profile"
path = "examples/profile.rs"

[[example]]
name = "mse_sweep"
path = "examples/mse_sweep.rs"
