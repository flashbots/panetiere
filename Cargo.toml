[package]
name = "panetiere"
version = "0.1.0"
edition = "2021"

[dependencies]
chipmunk_code = { git = "https://github.com/noot/Chipmunk", rev = "5c6a3324607eae7e25c509e44b4cb4658a86d994", default-features = false }
negacyclic-rings = { git = "https://github.com/Ruteri/negacyclic-rings", branch = "main" }
p256 = { version = "0.13", features = ["ecdsa"] }
ml-kem = "0.3"
aes-gcm = "0.10"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
sha2 = "0.10"
rayon = "1.10"
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "protocol_sweep"
harness = false

[[bench]]
name = "ring_kernels"
harness = false

[profile.dev.package.chipmunk_code]
opt-level = 2

[profile.dev.package.negacyclic-rings]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[example]]
name = "profile"
path = "examples/profile.rs"
