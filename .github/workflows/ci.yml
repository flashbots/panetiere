name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_BUILD_JOBS: 8
  CARGO_TERM_COLOR: always
  RAYON_NUM_THREADS: 8
  # The workspace .cargo/config.toml is developer-local (target-cpu=native);
  # CI builds portable.
  RUSTFLAGS: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      RUST_MIN_STACK: 33554432
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test

  # Codecov merges the two reports: x86 covers the AVX2 kernels, arm64 the
  # NEON kernels and the scalar fallbacks.
  coverage:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            flag: x86_64
          - runner: ubuntu-26.04-arm
            flag: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      RUST_MIN_STACK: 33554432
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ matrix.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Native arm64: runs the NEON kernels, and the scalar fallbacks that the
  # x86 jobs skip because their runners have AVX2.
  test-aarch64:
    runs-on: ubuntu-26.04-arm
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      RUST_MIN_STACK: 33554432
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The discrete Gaussian sampler must compile without branches on the sample,
  # and what the compiler emits depends on the toolchain and the target.
  dgauss-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: python3 scripts/dgauss_branches.py

  params:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-deps -r scripts/params/requirements.txt
      - run: python3 scripts/params/generate_params.py --check-only scripts/params/reference.json
      - run: python3 scripts/params/dgauss_cdt.py --check
