name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_BUILD_JOBS: 8
  CARGO_TERM_COLOR: always
  RAYON_NUM_THREADS: 8
  # The workspace .cargo/config.toml is developer-local (target-cpu=native);
  # CI builds portable.
  RUSTFLAGS: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features rns -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      RUST_MIN_STACK: 33554432
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test
      - run: cargo test --features rns

  check-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: cargo check --target aarch64-unknown-linux-gnu --features rns
