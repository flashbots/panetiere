  <text x="280" y="162" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">ciphertext + commitment posts</text>
  <text x="280" y="181" font-size="12.5" fill="#ffffff" text-anchor="middle">7.06 MB per client</text>
  <text x="280" y="200" font-size="12.5" fill="#ffffff" text-anchor="middle">bulletin ingests 2.12 GB</text>
  <text x="640" y="164" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">recipient downloads every post</text>
  <text x="640" y="183" font-size="12.5" fill="#ffffff" text-anchor="middle">300 × 7.06 MB = 2.12 GB</text>
  <text x="280" y="244" font-size="12" fill="#c3c2b7" text-anchor="middle">sealed envelopes · 70 KB × 16 per client</text>
  <text x="280" y="278" font-size="12" fill="#c3c2b7" text-anchor="middle">each server ingests 300 × 70 KB = 21 MB</text>
  <text x="655" y="310" font-size="12" fill="#c3c2b7" text-anchor="middle">147 KB per server · 2.35 MB at the recipient</text>

