  <text x="32" y="36" font-size="15" font-weight="600" fill="#ffffff">Bytes on the wire, one round — three ingress modes</text>
  <text x="32" y="56" font-size="12.5" fill="#c3c2b7">16 servers, 300 active clients, 16 KB messages, Prony sketch encoding, RS 14-of-16 — a round recovers 300 × 16 KB = 4.9 MB.</text>
  <text x="32" y="74" font-size="12.5" fill="#c3c2b7">e2e at 1 Gbit client, 4 Gbit server &amp; bulletin links.</text>

  <text x="32" y="106" font-size="12.5" font-weight="600" fill="#ffffff">Direct — recipient ingress 2.12 GB · e2e 9.1 s</text>

