<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 408" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="920" height="408" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>

  <text x="32" y="36" font-size="15" font-weight="600" fill="#ffffff">Bytes on the wire, one round</text>
  <text x="32" y="56" font-size="12.5" fill="#c3c2b7">16 servers, 300 active clients, 16 KB messages, Prony sketch encoding — a round recovers 300 × 16 KB = 4.9 MB.</text>
  <text x="32" y="74" font-size="12.5" fill="#c3c2b7">e2e at 1 Gbit client, 4 Gbit server &amp; bulletin links.</text>

  <text x="32" y="106" font-size="12.5" font-weight="600" fill="#ffffff">Recipient ingress 2.12 GB · e2e 9.1 s</text>

  <path d="M136,152 C280,152 280,132 424,132 L424,208 C280,208 280,228 136,228 Z" fill="#3987e5"/>
  <path d="M520,132 C640,132 640,134 760,134 L760,210 C640,210 640,208 520,208 Z" fill="#3987e5"/>
  <path d="M136,250 C280,250 280,318 424,318 L424,330 C280,330 280,262 136,262 Z" fill="#d95926"/>
  <path d="M520,323 C640,323 640,224 760,224 L760,226 C640,226 640,325 520,325 Z" fill="#199e70"/>

  <text x="280" y="162" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">ciphertext + commitment posts</text>
  <text x="280" y="181" font-size="12.5" fill="#ffffff" text-anchor="middle">7.06 MB per client</text>
  <text x="280" y="200" font-size="12.5" fill="#ffffff" text-anchor="middle">bulletin ingests 2.12 GB</text>
  <text x="640" y="164" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">recipient downloads every post</text>
  <text x="640" y="183" font-size="12.5" fill="#ffffff" text-anchor="middle">300 × 7.06 MB = 2.12 GB</text>
  <text x="280" y="244" font-size="12" fill="#c3c2b7" text-anchor="middle">sealed envelopes · 70 KB × 16 per client</text>
  <text x="280" y="278" font-size="12" fill="#c3c2b7" text-anchor="middle">each server ingests 300 × 70 KB = 21 MB</text>
  <text x="655" y="310" font-size="12" fill="#c3c2b7" text-anchor="middle">147 KB per server · 2.35 MB at the recipient</text>

  <rect x="40" y="112" width="96" height="150" rx="6" fill="#2c2c2a" stroke="rgba(255,255,255,0.10)"/>
  <rect x="40" y="120" width="96" height="150" rx="6" fill="#2c2c2a" stroke="rgba(255,255,255,0.10)"/>
  <rect x="40" y="128" width="96" height="150" rx="6" fill="#2c2c2a" stroke="rgba(255,255,255,0.10)"/>
  <text x="88" y="198" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">client</text>
  <text x="88" y="215" font-size="11" fill="#898781" text-anchor="middle">× 300</text>
  <rect x="424" y="108" width="96" height="124" rx="6" fill="#2c2c2a" stroke="rgba(255,255,255,0.10)"/>
  <text x="472" y="174" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">bulletin</text>
  <rect x="424" y="280" width="96" height="56" rx="6" fill="#2c2c2a" stroke="rgba(255,255,255,0.10)"/>
  <rect x="424" y="288" width="96" height="56" rx="6" fill="#2c2c2a" stroke="rgba(255,255,255,0.10)"/>
  <rect x="424" y="296" width="96" height="56" rx="6" fill="#2c2c2a" stroke="rgba(255,255,255,0.10)"/>
  <text x="472" y="320" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">server</text>
  <text x="472" y="337" font-size="11" fill="#898781" text-anchor="middle">× 16</text>
  <rect x="760" y="108" width="96" height="144" rx="6" fill="#2c2c2a" stroke="rgba(255,255,255,0.10)"/>
  <text x="808" y="184" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">recipient</text>

  <rect x="32" y="376" width="10" height="10" rx="2" fill="#3987e5"/>
  <text x="48" y="385" font-size="11.5" fill="#c3c2b7">ciphertext (public)</text>
  <rect x="180" y="376" width="10" height="10" rx="2" fill="#d95926"/>
  <text x="196" y="385" font-size="11.5" fill="#c3c2b7">key shares (sealed, one per server)</text>
